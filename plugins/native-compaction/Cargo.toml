[package]
name = "cpa-native-compaction"
version = "0.1.2"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
strip = "none"
