name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# A new push cancels the in-flight run for the previous commit.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary
      - run: bun --revision
      - run: bun ci
      - run: bun run check:ci
